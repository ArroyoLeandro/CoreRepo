services:
  postgres:
    image: postgres:16-alpine
    container_name: corerepo-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: corerepo
    volumes:
      - corerepo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d corerepo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  corerepo_pg_data:
